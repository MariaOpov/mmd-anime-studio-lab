name: MMD Lab all synthetic checkpoints (CP01-CP10)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package
        run: python -m pip install -e .
      - name: All checkpoint tests (CI only; not rerun by local CP10 installer)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($cp in 2..10) {
            $suite = 'cp{0:D2}/tests' -f $cp
            python -m unittest discover -s $suite -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Unified API smoke
        run: python -m cp09.cli readiness
      - name: CP10 pinned source audit
        run: python -m cp10.cli audit
