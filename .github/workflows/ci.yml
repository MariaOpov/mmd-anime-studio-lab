name: Lab CP01 Synthetic QA
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run all bundled synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: python -m mmd_lab plugins
